
{{- if .Values.frontend.enabled }}
# Frontend Service (Helm template, matches Session 15 manifest)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: frontend
    tier: presentation
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: frontend
    tier: presentation
{{- end }}
