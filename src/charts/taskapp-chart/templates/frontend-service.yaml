
{{- if .Values.frontend.enabled }}
# Frontend Service (Helm template, matches Session 15 manifest)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskapp.componentLabels" (dict "component" "frontend" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    {{- include "taskapp.componentSelectorLabels" (dict "component" "frontend" "context" .) | nindent 4 }}
{{- end }}
