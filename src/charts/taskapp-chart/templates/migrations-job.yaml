
{{- if .Values.migrations.enabled }}
# Backend Initializer (migrations) job template
apiVersion: batch/v1
kind: Job
metadata:
  name: migrations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskapp.componentLabels" (dict "component" "migrations" "context" .) | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        app: migrations
        tier: api
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-for-mysql
        image: busybox
        command:
          - sh
          - -c
          - |
            i=0
            until nc -z {{ include "taskapp.databaseHost" . }} {{ .Values.database.service.port }}; do
              i=$((i+1))
              if [ $i -ge 30 ]; then
                echo "MySQL not ready after 60s, giving up"
                exit 1
              fi
              echo "Waiting for mysql ($i/30)"
              sleep 2
            done
            echo "MySQL is ready"
      containers:
      - name: migrations
        image: {{ .Values.migrations.image | quote }}
        imagePullPolicy: {{ .Values.migrations.imagePullPolicy | default "IfNotPresent" }}
        env:
        - name: DB_HOST
          value: {{ include "taskapp.databaseHost" . | quote }}
        - name: DB_PORT
          value: {{ .Values.database.service.port | quote }}
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-database
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-password
        - name: MYSQL_TASKAPP_CONNECTION
          value: "Server=$(DB_HOST);Port=$(DB_PORT);Database=$(DB_NAME);User=$(DB_USER);Password=$(DB_PASSWORD);"
{{- end }}
