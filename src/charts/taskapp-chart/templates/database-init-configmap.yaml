{{- if .Values.database.enabled }}
# Database Initialization ConfigMap
# Session 16: Helm Package Manager
#
# Contains the SQL script that runs automatically when MySQL first starts.
# MySQL executes all .sql files found in /docker-entrypoint-initdb.d/ on
# first startup (only when the data directory is empty).
#
# The tasks table uses VARCHAR for status rather than ENUM so that any
# string value is accepted — this keeps the schema flexible across the
# frontend (todo/in-progress/done) and backend defaults.

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskapp.fullname" . }}-mysql-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskapp.componentLabels" (dict "component" "database" "context" .) | nindent 4 }}
data:
  init.sql: |
    USE {{ .Values.database.database }};

    CREATE TABLE IF NOT EXISTS tasks (
      id          INT AUTO_INCREMENT PRIMARY KEY,
      title       VARCHAR(255)  NOT NULL,
      description TEXT,
      status      VARCHAR(20)   NOT NULL DEFAULT 'todo',
      created_at  TIMESTAMP     DEFAULT CURRENT_TIMESTAMP,
      updated_at  TIMESTAMP     DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
      INDEX idx_status     (status),
      INDEX idx_created_at (created_at)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    INSERT INTO tasks (title, description, status) VALUES
      ('Setup Kubernetes cluster',   'Install and configure local Kubernetes environment',       'done'),
      ('Learn about Pods',           'Understand pod lifecycle and management',                  'done'),
      ('Deploy multi-tier app',      'Build complete application with database, backend, and frontend', 'in-progress'),
      ('Configure Ingress',          'Set up external access with TLS termination',              'todo'),
      ('Package app with Helm',      'Create a Helm chart for the entire three-tier application','in-progress');

    SELECT 'Database initialised' AS status, COUNT(*) AS tasks FROM tasks;
{{- end }}
