
{{- if .Values.database.enabled }}
# MySQL Database Secret (Helm template, matches Session 13 manifest)
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: mysql
    tier: database
type: Opaque
data:
  mysql-root-password: {{ .Values.database.rootPassword | b64enc | quote }}
  mysql-database: {{ .Values.database.database | b64enc | quote }}
  mysql-user: {{ .Values.database.user | b64enc | quote }}
  mysql-password: {{ .Values.database.password | b64enc | quote }}
{{- end }}
