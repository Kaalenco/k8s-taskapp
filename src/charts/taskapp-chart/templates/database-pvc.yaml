
{{- if and .Values.database.enabled .Values.database.persistence.enabled }}
# MySQL PersistentVolumeClaim (Helm template, matches Session 13 manifest)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskapp.componentLabels" (dict "component" "database" "context" .) | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.persistence.size | default "1Gi" }}
{{- end }}
