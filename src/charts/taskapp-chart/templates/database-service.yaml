
{{- if .Values.database.enabled }}
# MySQL Database Service (Helm template, matches Session 13 manifest)
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskapp.componentLabels" (dict "component" "database" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP
    name: mysql
  selector:
    {{- include "taskapp.componentSelectorLabels" (dict "component" "database" "context" .) | nindent 4 }}
{{- end }}
