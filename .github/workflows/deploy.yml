# Troubleshooting:
#
# Build fails:
# - Check Dockerfile syntax
# - Verify context path (./backend or ./frontend)
# - Check build logs in GitHub Actions
#
# Push fails:
# - Verify DOCKER_USERNAME and DOCKER_PASSWORD secrets
# - Check registry authentication
# - Ensure image name is correct
#
# Deploy fails:
# - Verify KUBECONFIG secret is correct
# - Check cluster connectivity
# - Verify namespace exists
# - Check Helm chart syntax
#
# Pods not ready:
# - Check pod logs: kubectl logs -n taskapp <pod-name>
# - Check events: kubectl get events -n taskapp
# - Verify image exists in registry
# - Check resource limits

# Best Practices:
# 1. Use semantic versioning for tags
# 2. Scan images for vulnerabilities
